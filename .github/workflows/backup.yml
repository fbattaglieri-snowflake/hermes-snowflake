name: Backup State

on:
  workflow_dispatch:
  # Uncomment to enable scheduled backups:
  # schedule:
  #   - cron: "0 3 * * 0"  # Weekly, Sunday 03:00 UTC

permissions:
  contents: read
  id-token: write

jobs:
  backup:
    if: vars.ENABLE_BACKUP == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: snowflakedb/snowflake-actions@1160898243c351349621a6c2bac2e455ab1077b2  # v3
        with:
          use-oidc: true
          cli-version: "3.16"
      - name: Create stage and block volume snapshot
        env:
          SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ vars.SNOWFLAKE_DEPLOY_USER }}
          SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_DEPLOY_ROLE }}
          SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}
        run: |
          snow sql -x -q "CREATE STAGE IF NOT EXISTS ${{ vars.SNOWFLAKE_DATABASE }}.${{ vars.SNOWFLAKE_SCHEMA }}.HERMES_BACKUPS ENCRYPTION = (TYPE = 'SNOWFLAKE_SSE') COMMENT = 'Hermes state backup archives';"

          SNAP_TS=$(date -u +%Y%m%d_%H%M%S)
          SNAP_NAME="HERMES_STATE_${SNAP_TS}"
          snow sql -x -q "
            CREATE SNAPSHOT IF NOT EXISTS ${{ vars.SNOWFLAKE_DATABASE }}.${{ vars.SNOWFLAKE_SCHEMA }}.${SNAP_NAME}
              FROM SERVICE ${{ vars.SNOWFLAKE_DATABASE }}.${{ vars.SNOWFLAKE_SCHEMA }}.HERMES_SERVICE
              VOLUME 'hermes-data'
              INSTANCE 0
              COMMENT = 'Automated SPCS block volume snapshot for Hermes';
          " || echo "::warning::CREATE SNAPSHOT failed (check role privileges or docs/backup-recovery.md for manual tar archive procedure)."
