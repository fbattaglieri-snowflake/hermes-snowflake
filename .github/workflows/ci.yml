name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation tools
        run: pip install pytest ruff yamllint
      - name: Validate
        run: ./scripts/validate.sh
      - name: Scan repository secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Scan files and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build hermes image (linux/amd64)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: docker/hermes/Dockerfile
          platforms: linux/amd64
          pull: true
          push: false
          load: true
          tags: hermes-snowflake:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The blocking scan covers what this repository can actually fix, so that
      # a red build always means there is an action to take.
      #
      # Excluded are the artifacts we consume rather than produce: the Hermes
      # agent tree and its seed, whose dependencies are resolved from the
      # upstream uv.lock at the pinned HERMES_GIT_SHA, and the Ollama,
      # cloudflared and Tailscale binaries, which upstream ships already
      # compiled — their Go dependencies change only when upstream rebuilds, so
      # the lever is the version pin, not a package override. Unfixed
      # vulnerabilities are excluded too: Ubuntu kernel headers routinely carry
      # CVEs with no released fix, and blocking on those makes every build red
      # regardless of what we change.
      #
      # The advisory scan that follows covers the whole image and never fails,
      # so the excluded debt stays visible on every run instead of disappearing.
      - name: Scan built image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: image
          image-ref: hermes-snowflake:test
          scanners: vuln
          format: json
          output: trivy-blocking.json
          severity: CRITICAL,HIGH
          ignore-unfixed: "true"
          skip-dirs: usr/local/lib/hermes-agent,opt/hermes-seed
          skip-files: usr/local/bin/ollama,usr/local/bin/cloudflared,usr/local/bin/tailscale,usr/local/bin/tailscaled
          exit-code: "1"
      - name: Scan built image including vendored dependencies
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: image
          image-ref: hermes-snowflake:test
          scanners: vuln
          format: json
          output: trivy-advisory.json
          severity: CRITICAL,HIGH
          exit-code: "0"
      - name: Summarize image findings
        if: always()
        run: |
          python3 scripts/summarize_trivy.py trivy-blocking.json \
            --title "Blocking findings — hermes-snowflake:test"
          python3 scripts/summarize_trivy.py trivy-advisory.json \
            --title "All findings including vendored and unfixed — hermes-snowflake:test"
